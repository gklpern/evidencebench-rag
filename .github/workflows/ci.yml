name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: evidencebench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidencebench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d evidencebench -f db/001_initial.sql -f db/002_dev_seed.sql
      - run: pytest -m integration
        env:
          EB_TEST_DATABASE_URL: postgresql+asyncpg://evidencebench:evidencebench@127.0.0.1:5432/evidencebench
      - run: docker compose config --quiet
