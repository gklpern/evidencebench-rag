services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: evidencebench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/002_dev_seed.sql:/docker-entrypoint-initdb.d/002_dev_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidencebench"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: evidencebench
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["object-data:/data"]

  api:
    profiles: ["application"]
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
